# Apache vhost for AUTOQUIRAY — HTTPS served by LAN IP (self-signed).
# Reachable from any device on the network at https://192.168.100.248
#
# Install:
#   sudo cp /var/www/autoquiray/deploy/autoquiray-ssl.conf /etc/apache2/sites-available/
#   sudo a2enmod ssl rewrite headers
#   sudo a2dissite autoquiray.conf 000-default.conf default-ssl.conf 2>/dev/null
#   sudo a2ensite autoquiray-ssl
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Make sure Apache listens on 443 (usually already via mods-enabled/ssl.conf -> ports.conf):
#   grep -R "Listen 443" /etc/apache2/ports.conf
#
# Firewall (allow LAN clients):
#   sudo ufw allow 443/tcp
#   sudo ufw allow 80/tcp
#
# Clients see a self-signed warning (no public CA). To trust on each device,
# import deploy/ssl/autoquiray.crt as a trusted authority.

# Plain HTTP -> redirect to HTTPS by IP.
<VirtualHost *:80>
    DocumentRoot /var/www/autoquiray/public
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    DocumentRoot /var/www/autoquiray/public

    <Directory /var/www/autoquiray/public>
        AllowOverride All
        Require all granted
        Options FollowSymLinks
    </Directory>

    SSLEngine on
    SSLCertificateFile    /var/www/autoquiray/deploy/ssl/autoquiray.crt
    SSLCertificateKeyFile /var/www/autoquiray/deploy/ssl/autoquiray.key

    Header always set X-Content-Type-Options "nosniff"

    ErrorLog  ${APACHE_LOG_DIR}/autoquiray-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/autoquiray-ssl-access.log combined
</VirtualHost>
</IfModule>
