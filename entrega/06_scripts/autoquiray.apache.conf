# /etc/apache2/sites-available/autoquiray.conf
#
# Reference VirtualHost for AUTOQUIRAY (Laravel 12) under Apache 2.4 + PHP-FPM.
# The actual :443 block is rewritten by `certbot --apache` after running
# scripts/setup-https.sh. This file documents the canonical post-certbot state.

<VirtualHost *:80>
    ServerName autoquiray.es
    ServerAlias www.autoquiray.es

    # Forced redirect to HTTPS (installed by certbot --redirect).
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName autoquiray.es
    ServerAlias www.autoquiray.es
    ServerAdmin admin@autoquiray.es

    DocumentRoot /var/www/autoquiray/public

    Protocols h2 http/1.1

    <Directory /var/www/autoquiray/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # PHP-FPM via unix socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # TLS material (managed by certbot)
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/autoquiray.es/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/autoquiray.es/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog  ${APACHE_LOG_DIR}/autoquiray-error.log
    CustomLog ${APACHE_LOG_DIR}/autoquiray-access.log combined
</VirtualHost>
</IfModule>
